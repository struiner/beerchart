<section
  #viewport
  class="viewport"
  data-testid="taxonomy-viewport"
  data-renderer="generic"
  [attr.data-e2e]="store.e2eMode"
  [class.animations-disabled]="!store.settings().animations"
  [attr.aria-label]="'Interactive circular ' + store.module.meta.title"
  tabindex="0"
  (pointerdown)="pointerDown($event)"
  (pointermove)="pointerMove($event)"
  (pointerup)="pointerUp($event)"
  (pointercancel)="pointerUp($event)"
  (wheel)="wheel($event)"
>
  <svg class="scene" data-testid="generic-renderer" aria-labelledby="diagram-title">
    <title id="diagram-title">{{ store.module.meta.title }}</title>
    <g [attr.transform]="transform()">
      <g class="orbit-guides generic-orbits" data-testid="ring-guides">
        @for (radius of store.positionedScene().ringRadii; track $index) {
          @if (radius > 0) {
            <circle cx="3100" cy="3100" [attr.r]="radius" />
          }
        }
      </g>
      @if (store.settings().connectors) {
        <g class="connectors generic-connectors" data-testid="edges">
          @for (edge of store.positionedScene().edges; track edge.id) {
            <path
              [attr.d]="
                'M' + edge.start.x + ',' + edge.start.y + ' L' + edge.end.x + ',' + edge.end.y
              "
              [class]="edge.visualToken"
              [class.active]="
                store.focusedRouteInstanceIds().includes(edge.parentInstanceId) &&
                store.focusedRouteInstanceIds().includes(edge.childInstanceId)
              "
            />
          }
        </g>
      }
      <g class="nodes generic-nodes" data-testid="nodes">
        @for (node of store.positionedScene().nodes; track node.instanceId) {
          <g
            class="node generic-node"
            [class]="'visual-' + node.visualToken + ' kind-' + node.kind"
            [class.selected]="store.selectedInstances().includes(node.instanceId)"
            [class.focused-instance]="store.focusedInstanceId() === node.instanceId"
            [attr.transform]="'translate(' + node.x + ' ' + node.y + ')'"
            [attr.data-testid]="'node-' + node.instanceId"
            [attr.data-entity-id]="node.entityId"
            tabindex="0"
            role="button"
            [attr.aria-label]="node.ariaLabel"
            (click)="select(node)"
            (dblclick)="openDetail(node); $event.stopPropagation()"
            (keydown.enter)="select(node)"
            (keydown.space)="select(node); $event.preventDefault()"
          >
            @if (node.layout.shape === 'circle') {
              <circle [attr.r]="node.layout.width / 2" />
            } @else {
              <rect
                [attr.x]="-node.layout.width / 2"
                [attr.y]="-node.layout.height / 2"
                [attr.width]="node.layout.width"
                [attr.height]="node.layout.height"
                rx="12"
              />
            }
            @if (node.kind !== 'entry' || store.settings().labels) {
              <text
                [attr.x]="labelX(node)"
                [attr.y]="labelY(node)"
                [attr.text-anchor]="labelAnchor(node)"
                [attr.transform]="'rotate(' + labelRotation(node) + ')'"
              >
                {{ node.title }}
              </text>
            }
          </g>
        }
      </g>
      @if (store.positionedScene().warnings.length) {
        <g class="projection-warning" data-testid="projection-warnings" role="status">
          <text x="24" y="42">
            {{ store.positionedScene().warnings.length }} projection warning(s)
          </text>
        </g>
      }
    </g>
  </svg>
  @if (store.selectedProfile(); as profile) {
    <section
      class="selection-details generic-selection-details"
      [class.detail-view]="store.detailMode() === 'expanded'"
      data-testid="taxonomy-profile"
      aria-label="Selected taxonomy profile"
    >
      <button
        class="details-close"
        type="button"
        aria-label="Close details"
        (pointerdown)="$event.stopPropagation()"
        (keydown.enter)="closeDetails($event)"
        (keydown.space)="closeDetails($event); $event.preventDefault()"
        (click)="closeDetails($event)"
      >
        ×
      </button>
      @if (store.selectedPathNodes().length) {
        <nav class="selected-category-path" aria-label="Selected category path">
          @for (category of store.selectedPathNodes(); track category.instanceId) {
            <button
              type="button"
              [attr.data-instance-id]="category.instanceId"
              [attr.data-entity-id]="category.entityId"
              (click)="select(category)"
            >
              {{ category.title }}
            </button>
          }
        </nav>
      }
      <app-generic-taxonomy-profile
        [profile]="profile"
        (selectTarget)="store.selectProfileTarget($event)"
      />
    </section>
  }
</section>
